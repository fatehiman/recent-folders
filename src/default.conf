// ============================================================================
//  Recent Folders - settings
// ============================================================================
//  This file must be next to the exe and have the same name, with ".conf".
//  Example: recent-folders.exe  ->  recent-folders.conf
//
//  Format: JSON. Lines that start with // are comments (not used).
//  To use a sample line: remove the "//" at the start and remove (or comment out)
//  the old line with the same name.
//  Changes are used the next time the window opens. No restart is needed.
//  If you delete this file, the app creates it again with default values.
//
//  Colors: "#RRGGBB", "#RGB", "#AARRGGBB" or a color name such as "white".
//  Sizes are in pixels at 100% Windows display scale. At 150% scale they are
//  1.5 times bigger, so the window looks the same on every screen.
// ============================================================================
{
  // ---------------------------------------------------------------- window --
  "window": {
    "width": 300,
    "height": 200,
    // "width": 420,
    // "height": 260,

    "backgroundColor": "#F9F9F9",
    // "backgroundColor": "#FFFFFF",
    // "backgroundColor": "#FFF8E7",      // warm paper
    // "backgroundColor": "#EEF3FA",      // light blue-gray
    // "backgroundColor": "#2B2B2B",      // dark (then also set "sectionTitleColor": "#C8C8C8")

    // 1.0 = not transparent, 0.3 = very transparent.
    "opacity": 1.0,
    // "opacity": 0.92,

    // Window corners (Windows 11): "round", "small" or "square".
    "corners": "round",
    // "corners": "small",
    // "corners": "square",

    // Window border color. "" = Windows default, "none" = no border.
    "borderColor": "",
    // "borderColor": "none",
    // "borderColor": "#C8C8C8",

    // Space inside the window edge, and space between the taskbar and the window.
    "padding": 10,
    "gap": 8,

    // Small titles: PINNED, MOST USED, RECENT.
    "showSectionTitles": true,
    // "showSectionTitles": false,
    "sectionTitleColor": "#6B6B6B",
    "scrollbarColor": "#B4B4B4"
  },

  // ------------------------------------------------------------------ fade --
  "fade": {
    "enabled": true,
    // "enabled": false,
    "fadeInMs": 150,
    "fadeOutMs": 200
    // "fadeInMs": 80,
    // "fadeOutMs": 300
  },

  // ------------------------------------------------------------ mouse over --
  "mouseOver": {
    // Open the window when the mouse is on the tray icon.
    // This is only the start value: the tray menu item "Open on mouse over"
    // changes it, and the app remembers your choice.
    "openOnMouseOver": true,
    // "openOnMouseOver": false,

    // Wait time (ms) with the mouse on the icon before the window opens.
    "showDelayMs": 250,
    // "showDelayMs": 0,

    // After the mouse was inside the window, the window closes at the moment the mouse
    // leaves it (no wait, only the fade out). This wait time (ms) is only used when the
    // mouse leaves the tray icon and never goes into the window.
    "hideDelayMs": 400
    // "hideDelayMs": 1000
  },

  // ------------------------------------------------------------------ font --
  "font": {
    "family": "Segoe UI",
    // "family": "Segoe UI Variable Text",
    // "family": "Calibri",
    // "family": "Consolas",

    // Badge text size in points.
    "size": 9,
    // "size": 10.5,

    // Section title size in points.
    "titleSize": 7.5
  },

  // ----------------------------------------------------------------- badge --
  "badge": {
    // Built-in styles:
    //   "pill"    - fully round ends (default)
    //   "rounded" - small round corners
    //   "square"  - no round corners
    //   "outline" - very light fill with a darker border
    //   "raised"  - soft gradient, border and small shadow
    //   "compact" - small, to show many folders
    // You can also use the "name" of a style from "customStyles" below.
    "style": "pill",
    // "style": "rounded",
    // "style": "square",
    // "style": "outline",
    // "style": "raised",
    // "style": "compact",
    // "style": "my-style",

    // Text in badges. Black and bold is easy to read on the light colors.
    "textColor": "#000000",
    "bold": true,

    // Badge color comes from the folder name: the same name always gets the same color.
    // saturation: 0 = gray, 1 = strong color.
    // lightness: 0.70 .. 0.97 (lower values are not allowed, colors stay light).
    "saturation": 0.70,
    "lightness": 0.86,
    // "saturation": 0.45,       // softer colors
    // "lightness": 0.92,        // more pastel

    // Space between badges.
    "spacing": 6,

    // Long folder names are cut with "..." after this width.
    "maxTextWidth": 150,

    // Pin symbol in front of pinned folder names.
    "showPinIcon": true,

    // "+ Add" button in the PINNED section.
    "showAddButton": true
  },

  // --------------------------------------------------------- custom styles --
  // Your own badge styles. Use one with "badge": { "style": "<name>" }.
  //   cornerRadius : -1 = fully round ends, 0 = square, or a radius in pixels
  //   paddingX/Y   : space around the text
  //   borderWidth  : 0 = no border
  //   borderDarken : 0..1, how much darker the border is than the badge color
  //   fillLighten  : 0..1, makes the badge color lighter (1 = white)
  //   shadow       : true/false, small shadow under the badge
  //   gradient     : true/false, soft top-to-bottom gradient
  "customStyles": [
    // {
    //   "name": "my-style",
    //   "cornerRadius": 4,
    //   "paddingX": 8,
    //   "paddingY": 2,
    //   "borderWidth": 1,
    //   "borderDarken": 0.3,
    //   "fillLighten": 0.2,
    //   "shadow": false,
    //   "gradient": false
    // },
    // {
    //   "name": "big-pill",
    //   "cornerRadius": -1,
    //   "paddingX": 14,
    //   "paddingY": 6,
    //   "shadow": true
    // }
  ],

  // -------------------------------------------------------------- sections --
  // Which sections to show, and in which order.
  // "pinned" = folders you pinned, "frequent" = most used, "recent" = last used.
  "sections": [ "pinned", "frequent", "recent" ],
  // "sections": [ "pinned", "recent" ],
  // "sections": [ "recent", "frequent", "pinned" ],

  // -------------------------------------------------------------- tracking --
  "tracking": {
    // How often (seconds) the app checks the open File Explorer windows.
    // Bigger = less CPU. When no Explorer window is open, the check costs almost nothing.
    "pollIntervalSeconds": 5,

    // A folder must stay open this long (seconds) to count as "used".
    // Folders you only pass through on the way to another folder are not counted.
    "dwellSeconds": 30,
    // "dwellSeconds": 15,

    // How many folders to show in each section.
    "maxRecent": 12,
    "maxFrequent": 8,

    // "Most used" = folders used at least "minUsesForFrequent" times
    // in the last "frequentDays" days. They are sorted by the number of uses in that time.
    // Old folders you do not use any more leave "Most used" by themselves.
    // "frequentDays": 0 = count all uses since the beginning (no time limit).
    "minUsesForFrequent": 2,
    "frequentDays": 30,
    // "minUsesForFrequent": 2,  "frequentDays": 1,     // 2 times per day
    // "minUsesForFrequent": 3,  "frequentDays": 7,     // 3 times per week

    // false = a folder is shown only once (in the first section that has it).
    "showDuplicates": false,

    // How many not-pinned folders to remember in total.
    "maxHistory": 300,

    // Folders that are never tracked. Use * and ? as wildcards.
    // In JSON, write a backslash as \\ (or use / instead).
    "excludePaths": [
      // "C:\\Windows*",
      // "C:/Program Files*",
      // "*\\node_modules*",
      // "*\\AppData\\Local\\Temp*"
    ]
  },

  // ------------------------------------------------------------ data file --
  // Where your pinned and recent folders are saved.
  // "" = "<exe name>.data.json" next to the exe. If that folder is read-only,
  // the app uses %LOCALAPPDATA%\recent-folders\ instead.
  // A relative path is relative to the exe folder. %VARIABLES% are allowed.
  "dataFile": ""
  // "dataFile": "%APPDATA%\\recent-folders\\data.json"
}
